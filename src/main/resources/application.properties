spring.config.import=optional:file:.env
spring.application.name=resource-server-lab
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8087/realms}/${KEYCLOAK_REALM:default}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8087/realms}/${KEYCLOAK_REALM:default}/protocol/openid-connect/certs
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:resource_server_lab}
spring.datasource.username=${DATABASE_USER:resource_user}
spring.datasource.password=${DATABASE_PASSWORD:resource_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.auth.converter.principle-attribute=${KEYCLOAK_JWT_ATTRIBUTE}
jwt.auth.converter.resource-id=${KEYCLOAK_CLIENT}