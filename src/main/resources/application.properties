spring.config.import=optional:file:.env
spring.application.name=resource-server-lab
server.servlet.context-path=/api
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8087/realms}/${KEYCLOAK_REALM_NAME:default}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8087/realms}/${KEYCLOAK_REALM_NAME:default}/protocol/openid-connect/certs
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:resource_server_lab}
spring.datasource.username=${DATABASE_USER:resource_user}
spring.datasource.password=${DATABASE_PASSWORD:resource_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Adaptador de salida activo para la gestion de usuarios: keycloak | jpa

jwt.auth.converter.principal-attribute=${JWT_ATTRIBUTE}
jwt.auth.converter.resource-id=${JWT_CLIENT_ID}

keycloak.admin.host=${KEYCLOAK_ADMIN_HOST:http://localhost}
keycloak.admin.port=${KEYCLOAK_ADMIN_PORT:8087}
keycloak.admin.realm-master=${KEYCLOAK_ADMIN_REALM:master}
keycloak.admin.realm-name=${KEYCLOAK_REALM_NAME}
keycloak.admin.admin-cli=${KEYCLOAK_ADMIN_CLI:admin-cli}
keycloak.admin.user=${KEYCLOAK_ADMIN_USER}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET}
# Mismo cliente que jwt.auth.converter.resource-id: el adaptador escribe los roles ahi y el
# converter los lee de ahi. Si divergen, los usuarios se quedan sin autoridades.
keycloak.admin.app-client-id=${JWT_CLIENT_ID}
